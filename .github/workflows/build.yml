name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Tests, publish and HTTPS self-test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The same script BUILD-AND-TEST.bat runs: .NET unit + integration tests, browser
      # client checks, self-contained publish, then the published host's HTTPS self-test.
      - name: Build and test
        shell: powershell
        run: ./scripts/Build-And-Test.ps1
      - name: Archive unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: AbyssRemote-windows-x64-unsigned
          path: dist/win-x64/
          retention-days: 7
