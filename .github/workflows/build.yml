name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Tests, publish and HTTPS self-test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The same script BUILD-AND-TEST.bat runs: .NET unit + integration tests, browser
      # client checks, publish, then the published program's HTTPS self-test. Here the publish
      # is the standalone one (-SelfContained); on a developer PC it uses the installed runtime.
      # AbyssRemote.exe is a windowed program; scripts/Run-Host.ps1 waits for it and passes
      # its output and exit code on, so a failed self-test fails this step.
      - name: Build and test
        shell: powershell
        run: ./scripts/Build-And-Test.ps1 -SelfContained
      - name: Archive unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: AbyssRemote-windows-x64-unsigned
          path: dist/win-x64/
          retention-days: 7
